  <path class="thin bone" d="M220 305 Q300 265 380 305"/>
  <path class="thin bone" d="M230 340 Q300 310 370 340"/>
  <path class="bone" d="M240 520 Q300 470 360 520"/>
  <path class="thin bone" d="M250 520 Q300 560 350 520"/>
  <path class="bone" d="M230 280 L150 360 L120 460"/>
  <path class="bone" d="M370 280 L450 360 L480 460"/>
  <path class="thin bone" d="M110 470 L80 520"/>
  <path class="thin bone" d="M490 470 L520 520"/>
  <path class="bone" d="M270 560 L230 700"/>
  <path class="bone" d="M330 560 L370 700"/>
  <path class="thin bone" d="M230 700 L210 760"/>
  <path class="thin bone" d="M370 700 L390 760"/>
  <text class="label" x="40" y="110">Skull</text>
