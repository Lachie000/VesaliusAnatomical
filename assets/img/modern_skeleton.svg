      .thin{ stroke-width:6; opacity:.75; }
      .label{ fill:#9fb2cf; font: 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    </style>
  </defs>

  <circle class="bone" cx="300" cy="110" r="70"/>
